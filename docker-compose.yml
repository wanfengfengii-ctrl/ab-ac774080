services:
  api:
    build: .
    image: pulse-deconvolver:latest
    environment:
      PORT: "8000"
      QUIET_LOGS: "1"
    ports:
      # Configurable host port; override with: HOST_PORT=9000 docker compose up
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      start_period: 2s
      retries: 20
    restart: unless-stopped

  verify:
    build: .
    image: pulse-deconvolver:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE: "http://api:8000"
    command: ["bash", "scripts/verify.sh"]
    restart: "no"
